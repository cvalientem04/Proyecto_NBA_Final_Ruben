<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/Logo.png">
    <title>NBA LIVE - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-logo"><img src="../img/Logo.png" alt="NBA LIVE Logo"></div>
        <h1 class="auth-title">NBA LIVE</h1>
        <p class="auth-subtitle">Inicia sesión para entrar a la cancha</p>

        <div id="message" class="message"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Entrar 🏀</button>
        </form>

        <div class="auth-footer">
            <a href="forgot-password.html">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="auth-footer" style="margin-top:10px">
            ¿No tienes cuenta? <a href="signup.html">Regístrate gratis</a>
        </div>
    </div>

    <script>
        const API_SERVER = 'http://localhost:3000';

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            // Desactivar botón
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            try {
                const response = await fetch(`${API_SERVER}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    const err = new Error(data.error || 'Error al iniciar sesión');
                    err.unverified = data.unverified || false;
                    throw err;
                }

                // Guardar token en localStorage
                localStorage.setItem('nba_token', data.token);
                localStorage.setItem('nba_user', JSON.stringify(data.user));

                // Mostrar éxito
                messageDiv.className = 'message success';
                messageDiv.textContent = `✅ ¡Bienvenido, ${data.user.username}! Redirigiendo...`;

                // Redirigir a la página NBA
                setTimeout(() => {
                    window.location.href = 'nba.html';
                }, 1500);

            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = `❌ ${error.message}`;
                if (error.unverified) {
                    messageDiv.innerHTML += ` <button onclick="resendVerification()" style="margin-top:8px;background:none;border:1px solid #ff6b6b;color:#ff6b6b;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:13px">Reenviar email</button>`;
                }
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar 🏀';
            }
        }

        async function resendVerification() {
            const email = document.getElementById('email').value.trim();
            if (!email) { alert('Escribe tu email primero.'); return; }
            try {
                const res = await fetch(`${API_SERVER}/api/resend-verification`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                const messageDiv = document.getElementById('message');
                messageDiv.className = 'message success';
                messageDiv.textContent = '✅ ' + data.message;
            } catch (e) {
                alert('Error de conexión.');
            }
        }

        // Si ya está logueado, redirigir
        if (localStorage.getItem('nba_token')) {
            window.location.href = 'nba.html';
        }
    </script>
</body>
</html>
