<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/Logo.png">
    <title>NBA LIVE - Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <a href="index.html" class="auth-top-logo" aria-label="NBA LIVE">
        <img src="../img/Logo.png" alt="NBA LIVE Logo">
    </a>

    <div class="auth-container">
        <div class="auth-logo"><img src="../img/Logo.png" alt="NBA LIVE Logo"></div>
        <h1 class="auth-title">NBA LIVE</h1>
        <p class="auth-subtitle">Crea tu cuenta y únete a la cancha</p>

        <div id="message" class="message"></div>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" placeholder="Tu nombre de MVP" required minlength="3">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
                <p class="password-requirements">Mínimo 6 caracteres</p>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Crear cuenta 🏀</button>
        </form>

        <div class="auth-footer">
            ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
        </div>
    </div>

    <script>
        const API_SERVER = 'http://localhost:3000';

        async function handleSignup(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            // Validar contraseñas
            if (password !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Las contraseñas no coinciden.';
                return;
            }

            // Desactivar botón
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creando cuenta...';

            try {
                const response = await fetch(`${API_SERVER}/api/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error al crear la cuenta');
                }

                messageDiv.className = 'message success';
                messageDiv.textContent = '✅ ' + data.message;
                document.getElementById('signupForm').style.display = 'none';

            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = `❌ ${error.message}`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Crear cuenta 🏀';
            }
        }

        // Si ya está logueado, redirigir
        if (localStorage.getItem('nba_token')) {
            window.location.href = 'nba.html';
        }
    </script>
</body>
</html>
