<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../img/Logo.png">
    <title>NBA LIVE - Recuperar contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <a href="index.html" class="auth-top-logo" aria-label="NBA LIVE">
        <img src="../img/Logo.png" alt="NBA LIVE Logo">
    </a>

    <div class="auth-container">
        <div class="auth-logo"><img src="../img/Logo.png" alt="NBA LIVE Logo"></div>
        <h1 class="auth-title">NBA LIVE</h1>
        <p class="auth-subtitle">Introduce tu email y te enviamos un enlace para restablecer tu contraseña</p>

        <div id="message" class="message"></div>

        <form id="forgotForm" onsubmit="handleForgot(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Enviar enlace</button>
        </form>

        <div class="auth-footer">
            <a href="index.html">← Volver al inicio de sesión</a>
        </div>
    </div>

    <script>
        const API_SERVER = 'http://localhost:3000';

        async function handleForgot(event) {
            event.preventDefault();
            const email     = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';

            try {
                const res = await fetch(`${API_SERVER}/api/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                messageDiv.className = 'message success';
                messageDiv.textContent = '✅ ' + data.message;
                document.getElementById('forgotForm').style.display = 'none';
            } catch (e) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Error de conexión. ¿Está el servidor encendido?';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar enlace';
            }
        }
    </script>
</body>
</html>
