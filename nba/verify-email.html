<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA LIVE - Verificar email</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <a href="index.html" class="auth-top-logo"><img src="../img/Logo.png" alt="NBA LIVE Logo"></a>
    <div class="auth-container">
        <div class="auth-logo"><img src="../img/Logo.png" alt="NBA LIVE Logo"></div>
        <h1 class="auth-title">NBA LIVE</h1>
        <div class="status-icon" id="statusIcon"><span class="spinner">⏳</span></div>
        <p class="status-msg" id="statusMsg">Verificando tu email...</p>
        <div id="actionBtn"></div>
    </div>

    <script>
        const API_SERVER = 'http://localhost:3000';
        const token = new URLSearchParams(window.location.search).get('token');

        async function verify() {
            const icon = document.getElementById('statusIcon');
            const msg  = document.getElementById('statusMsg');
            const btn  = document.getElementById('actionBtn');

            if (!token) {
                icon.textContent = '❌';
                msg.textContent  = 'Enlace no válido. Vuelve al login y solicita un nuevo email de verificación.';
                btn.innerHTML    = '<a href="index.html" class="btn">Ir al login</a>';
                return;
            }

            try {
                const res  = await fetch(`${API_SERVER}/api/verify-email?token=${encodeURIComponent(token)}`);
                const data = await res.json();

                if (res.ok) {
                    icon.textContent = '✅';
                    msg.textContent  = data.message + ' Redirigiendo al login...';
                    btn.innerHTML    = '<a href="index.html" class="btn">Entrar ahora</a>';
                    setTimeout(() => { window.location.href = 'index.html'; }, 2500);
                } else {
                    icon.textContent = '❌';
                    msg.textContent  = data.error || 'El enlace no es válido o ha expirado.';
                    btn.innerHTML    = '<a href="index.html" class="btn">Ir al login</a>';
                }
            } catch (e) {
                icon.textContent = '❌';
                msg.textContent  = 'Error de conexión. ¿Está el servidor encendido?';
                btn.innerHTML    = '<a href="index.html" class="btn">Ir al login</a>';
            }
        }

        verify();
    </script>
</body>
</html>
