<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA LIVE - Nueva contraseña</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(224, 58, 62, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(224, 58, 62, 0.1) 0%, transparent 50%);
        }
        .auth-top-logo { position: fixed; top: 18px; left: 20px; text-decoration: none; z-index: 20; }
        .auth-top-logo img { width: 42px; height: 42px; object-fit: contain; display: block; }
        .auth-container {
            background-color: #1d1d1d;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid #2d2d2d;
        }
        .auth-logo { text-align: center; margin-bottom: 10px; }
        .auth-logo img { width: 62px; height: 62px; object-fit: contain; }
        .auth-title { text-align: center; font-size: 28px; font-weight: 900; margin-bottom: 5px; color: #e03a3e; }
        .auth-subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input {
            width: 100%; padding: 14px 16px;
            background-color: #2d2d2d; border: 2px solid #3d3d3d;
            border-radius: 8px; color: #fff; font-size: 15px; transition: border-color 0.3s;
        }
        .form-group input:focus { outline: none; border-color: #e03a3e; }
        .form-group input::placeholder { color: #666; }
        .submit-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #e03a3e, #c42f33);
            color: #fff; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(224,58,62,0.4); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-footer { text-align: center; margin-top: 25px; color: #888; font-size: 14px; }
        .auth-footer a { color: #e03a3e; text-decoration: none; font-weight: 600; }
        .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; display: none; }
        .message.error { background-color: rgba(224,58,62,0.15); border: 1px solid #e03a3e; color: #ff6b6b; display: block; }
        .message.success { background-color: rgba(46,204,113,0.15); border: 1px solid #2ecc71; color: #2ecc71; display: block; }
    </style>
</head>
<body>
    <a href="login.html" class="auth-top-logo" aria-label="NBA LIVE">
        <img src="../img/Logo.png" alt="NBA LIVE Logo">
    </a>

    <div class="auth-container">
        <div class="auth-logo"><img src="../img/Logo.png" alt="NBA LIVE Logo"></div>
        <h1 class="auth-title">NBA LIVE</h1>
        <p class="auth-subtitle">Elige tu nueva contraseña</p>

        <div id="message" class="message"></div>

        <form id="resetForm" onsubmit="handleReset(event)">
            <div class="form-group">
                <label for="password">Nueva contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
                <label for="password2">Repetir contraseña</label>
                <input type="password" id="password2" placeholder="Repite la contraseña" required minlength="6">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Guardar contraseña</button>
        </form>

        <div class="auth-footer">
            <a href="login.html">← Volver al inicio de sesión</a>
        </div>
    </div>

    <script>
        const API_SERVER = 'http://localhost:3000';
        const token = new URLSearchParams(window.location.search).get('token');
        const messageDiv = document.getElementById('message');

        if (!token) {
            messageDiv.className = 'message error';
            messageDiv.textContent = '❌ Enlace no válido. Solicita uno nuevo desde el login.';
            document.getElementById('resetForm').style.display = 'none';
        }

        async function handleReset(event) {
            event.preventDefault();
            const password  = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const submitBtn = document.getElementById('submitBtn');

            if (password !== password2) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Las contraseñas no coinciden.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Guardando...';

            try {
                const res = await fetch(`${API_SERVER}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '❌ ' + (data.error || 'Error al restablecer.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Guardar contraseña';
                    return;
                }

                messageDiv.className = 'message success';
                messageDiv.textContent = '✅ Contraseña actualizada. Redirigiendo al login...';
                document.getElementById('resetForm').style.display = 'none';
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            } catch (e) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Error de conexión.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar contraseña';
            }
        }
    </script>
</body>
</html>
