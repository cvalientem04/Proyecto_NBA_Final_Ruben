<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA LIVE - Nueva contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <a href="index.html" class="auth-top-logo" aria-label="NBA LIVE">
        <img src="../img/Logo.png" alt="NBA LIVE Logo">
    </a>

    <div class="auth-container">
        <div class="auth-logo"><img src="../img/Logo.png" alt="NBA LIVE Logo"></div>
        <h1 class="auth-title">NBA LIVE</h1>
        <p class="auth-subtitle">Elige tu nueva contraseña</p>

        <div id="message" class="message"></div>

        <form id="resetForm" onsubmit="handleReset(event)">
            <div class="form-group">
                <label for="password">Nueva contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <div class="form-group">
                <label for="password2">Repetir contraseña</label>
                <input type="password" id="password2" placeholder="Repite la contraseña" required minlength="6">
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Guardar contraseña</button>
        </form>

        <div class="auth-footer">
            <a href="index.html">← Volver al inicio de sesión</a>
        </div>
    </div>

    <script>
        const API_SERVER = 'http://localhost:3000';
        const token = new URLSearchParams(window.location.search).get('token');
        const messageDiv = document.getElementById('message');

        if (!token) {
            messageDiv.className = 'message error';
            messageDiv.textContent = '❌ Enlace no válido. Solicita uno nuevo desde el login.';
            document.getElementById('resetForm').style.display = 'none';
        }

        async function handleReset(event) {
            event.preventDefault();
            const password  = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;
            const submitBtn = document.getElementById('submitBtn');

            if (password !== password2) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Las contraseñas no coinciden.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Guardando...';

            try {
                const res = await fetch(`${API_SERVER}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '❌ ' + (data.error || 'Error al restablecer.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Guardar contraseña';
                    return;
                }

                messageDiv.className = 'message success';
                messageDiv.textContent = '✅ Contraseña actualizada. Redirigiendo al login...';
                document.getElementById('resetForm').style.display = 'none';
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            } catch (e) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Error de conexión.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Guardar contraseña';
            }
        }
    </script>
</body>
</html>
